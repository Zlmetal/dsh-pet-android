name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK，不用 android-actions/setup-android（它要装已废弃的 "tools" 包会失败）
      - name: Install platform + build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          echo "$KS_B64" | base64 -d > signing/debug.keystore
          ls -l signing/debug.keystore

      - name: Build
        run: |
          chmod +x build.sh
          SKIP_GEN_HTML=1 bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-apk
          path: build/pet.apk
          if-no-files-found: error
